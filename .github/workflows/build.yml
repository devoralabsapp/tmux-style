name: Build and test Windows, Linux and macOS
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install native tmux
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            brew list tmux >/dev/null 2>&1 || brew install tmux
          else
            sudo apt-get update
            sudo apt-get install -y tmux zsh
          fi
      - name: Check shell syntax and generated palettes
        run: |
          for script in unix/*.sh linux/*.sh macos/*.command; do bash -n "$script"; done
          python3 unix/generate.py
          git diff --exit-code -- unix/themes
      - name: Exercise installed workspace on an isolated tmux server
        run: python3 unix/test.py
      - name: Build Unix packages
        run: python3 unix/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: TmuxStyle-${{ runner.os }}
          path: |
            dist/tmux-style-*.tar.gz
            dist/tmux-style-*.sha256
            dist/unix-test-*.json
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate themes and check generated files
        shell: pwsh
        run: |
          python build_themes.py
          python windows-terminal/build_settings.py
          git diff --exit-code -- themes windows-terminal/settings.additions.json windows-terminal/wezterm-palettes.json
      - name: Compile and test packaged EXE on Windows PowerShell
        shell: pwsh
        run: ./windows-terminal/build.ps1 -RunTests
      - name: Validate settings with the official Terminal schema
        shell: pwsh
        run: |
          ./windows-terminal/setup.ps1 -SettingsPath "$env:RUNNER_TEMP/terminal-settings.json" -AssetDirectory "$env:RUNNER_TEMP/tmux-style-assets" -DefaultDirectory $env:RUNNER_TEMP -NoShortcut
          if (-not (Test-Json -LiteralPath ./windows-terminal/settings.staged.json -SchemaFile ./windows-terminal/profiles.schema.json)) { throw 'Invalid settings' }
      - name: Validate real WezTerm Lua APIs and status callbacks
        shell: pwsh
        run: |
          $pin=Get-Content ./windows-terminal/wezterm-runtime.json -Raw | ConvertFrom-Json
          $archive=Join-Path $env:RUNNER_TEMP 'wezterm.zip'
          Invoke-WebRequest -Uri $pin.url -OutFile $archive
          if ((Get-FileHash $archive).Hash -ne $pin.sha256) { throw 'WezTerm checksum mismatch' }
          $runtime=Join-Path $env:RUNNER_TEMP 'wezterm-runtime'
          Expand-Archive $archive $runtime
          ./windows-terminal/test-wezterm-lua.ps1 -SourceDirectory ./windows-terminal -WezTermExecutable (Join-Path $runtime ($pin.folder+'/wezterm.exe')) -ReportFile ./dist/wezterm-lua-test.json
      - uses: actions/upload-artifact@v4
        with:
          name: TmuxStyle-Windows
          path: |
            dist/TmuxStyle-Setup-*.exe
            dist/SHA256SUMS.txt
            dist/self-test.json
            dist/wezterm-lua-test.json
