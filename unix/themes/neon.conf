# NEON / CIRCUIT
# A quiet, single-row UI. No patched font or extra theme plugin required.
# Keep the samoshkin color contract for remote config and F12 bindings.
color_dark="#171326"
color_light="#eae1fa"
color_session_text="#bda2f2"
color_status_text="#b4a2cd"
color_main="#ef88d8"
color_secondary="#bda2f2"
color_level_ok="#7de3ce"
color_level_warn="#f5d38e"
color_level_stress="#fc8cae"
color_window_off_indicator="#f5d38e"
color_window_off_status_bg="#28203b"
color_window_off_status_current_bg="#b4a2cd"

# Explicit text labels work with ordinary monospace fonts over SSH as well.
# Theme only: do not change shell, terminal type, key tables or clipboard.
set -g status on
set -g status-position bottom
set -g status-interval 2
set -g status-justify left
set -g status-style "bg=$color_dark,fg=$color_status_text"
set -g status-left-length 28
set -g status-right-length 90

# Width-aware session and window names leave more room for tabs.
midnight_status_left='#[bg=#302441,fg=#bda2f2,bold] #{?#{e|>=:#{client_width},100},#{=18:session_name},#{=10:session_name}} #[default] '
set -g status-left "$midnight_status_left"
set -g window-status-separator ' '
setw -g window-status-style "bg=$color_dark,fg=$color_status_text,none"
setw -g window-status-format ' #I #{window_name}#{?window_bell_flag, !,#{?window_activity_flag, +,}} '
setw -g window-status-current-style "bg=$color_main,fg=$color_dark,bold"
setw -g window-status-current-format ' #I #{window_name} '
setw -g window-status-activity-style "fg=$color_level_warn,bg=$color_dark"
setw -g window-status-bell-style "fg=$color_level_stress,bg=$color_dark,bold"
setw -g window-status-last-style "fg=$color_light"

# Modes are native tmux formats: update immediately, without a polling shell.
# OFF means F12 is forwarding keys to an inner tmux.
midnight_modes='#{?#{==:#{key-table},off},#[bg=#f5d38e#,fg=#171326#,bold] OFF #[default] ,#{?pane_in_mode,#[bg=#bda2f2#,fg=#171326#,bold] COPY #[default] ,#{?client_prefix,#[bg=#f5d38e#,fg=#171326#,bold] PREFIX #[default] ,}}}#{?window_zoomed_flag,#[bg=#302441#,fg=#ef88d8#,bold] ZOOM #[default] ,}'
# >=140 cols: date; >=110: CPU/RAM; >=80: hostname; narrow: clock.
# CPU/RAM use the local operating system, without a plugin.
midnight_metrics='#{?#{e|>=:#{client_width},110},#(bash "$TMUX_STYLE_HOME/metrics.sh")  ,}' 
midnight_host='#{?#{e|>=:#{client_width},80},#[fg=#b4a2cd]#{?SSH_CONNECTION,SSH ,}#{=18:host_short}  ,}'
midnight_date='#{?#{e|>=:#{client_width},140},#[fg=#b4a2cd]%d %b  ,}'
midnight_status_right="$midnight_modes$midnight_metrics$midnight_host$midnight_date#[bg=#302441,fg=#eae1fa,bold] %H:%M #[default]"
set -g status-right "$midnight_status_right"

# Soft inactive dividers; cyan identifies the focused pane.
setw -g window-style default
setw -g window-active-style default
setw -g pane-border-status off
setw -g pane-border-style "fg=#53406e"
setw -g pane-active-border-style "fg=$color_main"
set -g display-panes-colour '#b4a2cd'
set -g display-panes-active-colour "$color_main"
set -g message-style "bg=#302441,fg=$color_light"
set -g message-command-style "bg=#302441,fg=$color_main,bold"
setw -g mode-style "bg=$color_secondary,fg=$color_dark,bold"
setw -g clock-mode-colour "$color_main"
setw -g clock-mode-style 24


set -g @tmux_style_theme 'neon'
setw -g window-style 'bg=#100e1b,fg=#eae1fa'
setw -g window-active-style 'bg=#100e1b,fg=#eae1fa'
