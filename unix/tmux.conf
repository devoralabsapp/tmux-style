# Standalone Linux/macOS configuration. Loaded on the tmux-style socket only.
# Personal baseline: familiar bindings, independent of TPM or other dotfiles.
set -g default-terminal 'screen-256color'
set -as terminal-overrides ',*:Tc'
set -g history-limit 20000
set -g buffer-limit 20
set -sg escape-time 0
set -g display-time 1500
set -g remain-on-exit off
set -g repeat-time 300
set -g base-index 1
setw -g pane-base-index 1
setw -g allow-rename off
setw -g automatic-rename off
set -g mouse on
set -g set-clipboard external
set -g set-titles on
set -g set-titles-string '#I:#W'
set -g update-environment 'DISPLAY WAYLAND_DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION SSH_TTY WINDOWID XAUTHORITY'
set -g prefix C-a
unbind C-b
# Older tmux versions have no prefix timeout: keep their unlimited wait.
set -gq prefix-timeout 2000
source-file "$TMUX_STYLE_HOME/theme.conf"

bind C-a send-prefix
bind C-r source-file "$TMUX_STYLE_HOME/entry.conf" \; display 'Tmux Style reloaded'
bind C-e new-window -n tmux-style '"${EDITOR:-vi}" "$TMUX_STYLE_HOME/tmux.conf"'
bind c new-window -c '#{pane_current_path}'
bind r command-prompt -I '#{window_name}' "rename-window '%%'"
bind R command-prompt -I '#{session_name}' "rename-session '%%'"
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind -r Tab last-window
bind -r C-o swap-pane -D
bind x kill-pane
bind X kill-window
bind C-x confirm-before -p 'Kill other windows? (y/n)' 'kill-window -a'
bind Q confirm-before -p 'Kill session #S? (y/n)' kill-session
bind d detach-client
bind D if -F '#{session_many_attached}' 'confirm-before -p "Detach other clients? (y/n)" "detach -a"' 'display "Only one client attached"'
bind L command-prompt -p 'Link window from (session:window): ' 'link-window -s %% -a'
bind C-s if -F '#{s/off//:status}' 'set status off' 'set status on'
bind m setw monitor-activity \; display 'Monitor activity [#{?monitor-activity,ON,OFF}]'
bind M if -F '#{monitor-silence}' 'setw monitor-silence 0' 'command-prompt -p "Monitor silence (seconds): " "setw monitor-silence %%"'
bind -r Left select-pane -L
bind -r Right select-pane -R
bind -r Up select-pane -U
bind -r Down select-pane -D
bind -r C-Left resize-pane -L 3
bind -r C-Right resize-pane -R 3
bind -r C-Up resize-pane -U 3
bind -r C-Down resize-pane -D 3
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -n M-S-Left resize-pane -L 3
bind -n M-S-Right resize-pane -R 3
bind -n M-S-Up resize-pane -U 3
bind -n M-S-Down resize-pane -D 3
bind -n S-Left previous-window
bind -n S-Right next-window
bind -n C-S-Left swap-window -t -1
bind -n C-S-Right swap-window -t +1
bind -n C-t new-window -a -c '#{pane_current_path}'
bind t run-shell 'bash "$TMUX_STYLE_HOME/cli.sh" choose-theme'

setw -g mode-keys vi
bind Enter choose-buffer
bind -T copy-mode-vi M-Up send-keys -X scroll-up
bind -T copy-mode-vi M-Down send-keys -X scroll-down
bind -T copy-mode-vi M-PageUp send-keys -X halfpage-up
bind -T copy-mode-vi M-PageDown send-keys -X halfpage-down
bind -T copy-mode-vi PageUp send-keys -X page-up
bind -T copy-mode-vi PageDown send-keys -X page-down
bind -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 2 scroll-down
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'bash "$TMUX_STYLE_HOME/yank.sh"'
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'bash "$TMUX_STYLE_HOME/yank.sh"'
bind -T copy-mode-vi Y send-keys -X copy-line \; run-shell 'tmux save-buffer - | bash "$TMUX_STYLE_HOME/yank.sh"'
bind -T copy-mode-vi D send-keys -X copy-end-of-line \; run-shell 'tmux save-buffer - | bash "$TMUX_STYLE_HOME/yank.sh"'
bind -T copy-mode-vi C-j send-keys -X copy-pipe-and-cancel 'bash "$TMUX_STYLE_HOME/yank.sh"'
bind -T copy-mode-vi A send-keys -X append-selection-and-cancel \; run-shell 'tmux save-buffer - | bash "$TMUX_STYLE_HOME/yank.sh"'
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe 'bash "$TMUX_STYLE_HOME/yank.sh"'
bind -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X clear-selection

# OFF forwards all keys, including Ctrl-a, to a nested/remote tmux.
bind -T root F12 set prefix None \; set key-table off \; if -F '#{pane_in_mode}' 'send-keys -X cancel' \; refresh-client -S
bind -T off F12 set -u prefix \; set -u key-table \; refresh-client -S
bind -T root S-Up set prefix None \; set key-table off \; refresh-client -S
bind -T off S-Down set -u prefix \; set -u key-table \; refresh-client -S
